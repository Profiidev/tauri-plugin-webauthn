name: Renovate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "10 0 * * 1" # every Monday at 0:10 AM
    - cron: "10 0 1 * *" # every first day of the month at 0:10 AM
  issues:
    types:
      - edited
  pull_request:
    types:
      - edited

env:
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache

jobs:
  renovate:
    runs-on: ubuntu-latest
    environment: internal-ci
    if: >
      github.event_name != 'issues' &&
      github.event_name != 'pull_request' ||
      (github.event_name == 'issues' && github.event.issue.title == 'Dependency Dashboard') ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'profidev-commit-bot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-restore
        with:
          path: ${{ env.cache_dir }}
          key: ${{ env.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.cache_key }}-${{ github.run_id }}-
            ${{ env.cache_key }}-

      - name: Fix restored cache ownership
        run: |
          mkdir -p /tmp/renovate/cache/renovate/repository
          mkdir -p /tmp/renovate/cache/containerbase
          sudo chown -R 12021:0 /tmp/renovate/
          ls -R $cache_dir

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM_COMMIT: 'enabled'
          RENOVATE_REPOSITORY_CACHE: 'enabled'
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
